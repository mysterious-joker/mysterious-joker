<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Lim Zi Chao — AI, Software and Data Engineering</title>
  <desc id="desc">A restrained graphite and cobalt profile banner for Lim Zi Chao, NUS Computer Science and Mathematics student and ASEAN Undergraduate Scholar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e141c"/>
      <stop offset="1" stop-color="#151e2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d8cff"/>
      <stop offset="1" stop-color="#8baeff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7ea5ff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect x="24" y="24" width="1152" height="272" rx="12" fill="none" stroke="#9dadbf" stroke-opacity="0.16"/>
  <rect x="64" y="68" width="5" height="184" rx="2.5" fill="url(#accent)"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="100" y="132" fill="#f4f7fb" font-size="68" font-weight="700" letter-spacing="1.5">LIM ZI CHAO</text>
    <text x="103" y="180" fill="#7ea5ff" font-size="22" font-weight="600" letter-spacing="5">AI / SOFTWARE / DATA ENGINEERING</text>
    <text x="103" y="222" fill="#d8e0ea" font-size="21" font-weight="400">NUS Computer Science + Mathematics</text>
    <text x="103" y="254" fill="#9dadbf" font-size="14" font-weight="500" letter-spacing="1.8">ASEAN UNDERGRADUATE SCHOLAR</text>
  </g>

  <g fill="none" stroke="#7ea5ff" stroke-linecap="round">
    <path d="M865 92H1110" stroke-opacity="0.34" stroke-width="2"/>
    <path d="M930 126H1140" stroke-opacity="0.2"/>
    <path d="M825 214H1040L1100 154" stroke-opacity="0.27" stroke-width="2"/>
    <path d="M985 246H1136" stroke-opacity="0.16"/>
  </g>
  <g fill="#7ea5ff">
    <circle cx="865" cy="92" r="4" fill-opacity="0.65"/>
    <circle cx="1110" cy="92" r="4" fill-opacity="0.45"/>
    <circle cx="825" cy="214" r="4" fill-opacity="0.55"/>
    <circle cx="1100" cy="154" r="4" fill-opacity="0.4"/>
  </g>
</svg>
