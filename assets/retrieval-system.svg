<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Shopping Copilot retrieval architecture</title><desc id="desc">Conversation becomes constraints, passes through lexical and dense retrieval, fuses and reranks candidates, then returns recommendations and the next useful question.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#6E9BFF"/></marker></defs>
  <rect width="1200" height="430" rx="20" fill="#111820"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="48" y="58" fill="#7EA5FF" font-size="14" letter-spacing="3">DETERMINISTIC RETRIEVAL LOOP</text><text x="48" y="98" fill="#F4F7FB" font-size="28" font-weight="700">From conversation to ranked evidence</text>
    <g fill="none" stroke="#33465C" stroke-width="2"><rect x="48" y="146" width="188" height="190" rx="14"/><rect x="280" y="146" width="238" height="82" rx="14"/><rect x="280" y="254" width="238" height="82" rx="14"/><rect x="562" y="146" width="176" height="190" rx="14"/><rect x="782" y="146" width="176" height="190" rx="14"/><rect x="1002" y="146" width="150" height="190" rx="14"/></g>
    <g stroke="#6E9BFF" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M236 241h35"/><path d="M518 187h35"/><path d="M518 295h35"/><path d="M738 241h35"/><path d="M958 241h35"/></g>
    <g fill="#F4F7FB" font-size="18" font-weight="700"><text x="72" y="184">Conversation</text><text x="304" y="181">Lexical recall</text><text x="304" y="289">Semantic recall</text><text x="586" y="184">Rank fusion</text><text x="806" y="184">Evidence rerank</text><text x="1026" y="184">Response</text></g>
    <g fill="#9DADBF" font-size="14"><text x="72" y="218">Intent + constraints</text><text x="72" y="245">Clarifying turns</text><text x="72" y="272">Session state</text><text x="304" y="207">SQLite FTS5 · BM25</text><text x="304" y="315">BGE-small · INT8 ONNX</text><text x="586" y="218">Reciprocal-rank</text><text x="586" y="242">fusion + route gating</text><text x="806" y="218">Exact structured</text><text x="806" y="242">product attributes</text><text x="806" y="266">and constraints</text><text x="1026" y="218">Ranked items</text><text x="1026" y="242">+ next best</text><text x="1026" y="266">question</text></g>
    <path d="M1080 350C940 400 255 410 132 349" stroke="#293747" fill="none" stroke-width="2" stroke-dasharray="6 8" marker-end="url(#arrow)"/><text x="466" y="394" fill="#6F8298" font-size="13" letter-spacing="1">FEEDBACK UPDATES SESSION EVIDENCE</text>
  </g>
</svg>
